[package]
name = "onnx"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "cluaiz_onnx"
crate-type = ["rlib"]

[dependencies]
# ── Sovereign ONNX Backend (CPU Multimodal Engine) ──
ort = "2.0.0-rc.12" # ONNX Runtime bindings
anyhow = "1.0"
tracing = "0.1"
cluaiz-shared = { path = "../../cluaiz-engine/engines/cluaiz-shared" }
neural-core = { path = "../neural_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.15" # HuggingFace Tokenizers

[features]
default = []
