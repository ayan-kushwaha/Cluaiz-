name: Cluaiz CLI

on:
  push:
    paths:
      - 'Apps/cli/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ─── STAGE 1: CLI Compilation (EXTENDED MATRIX) ────────────────────
  build-cli:
    name: 🖥️ Build CLI [${{ matrix.target }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win-x64
            ext: exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            ext: binary
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            ext: binary
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: mac-arm64
            ext: binary

    steps:
      - name: Checkout Code
        uses: actions/checkout@v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross-Compilation Toolchain (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build CLI
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: 1
          OPENSSL_VENDORED: 1
        run: cargo build --release -p cli --target ${{ matrix.target }}

      - name: Upload CLI to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: target/${{ matrix.target }}/release/cli*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-cli' }}
          name: Cluaiz Sovereign Release [${{ matrix.target }}]
          body: "Industrial Cluaiz CLI compiled for sovereign execution."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── STAGE 2: CLI Manifest Generation ──────────────────────────────
  publish-cli-manifest:
    name: 📂 Publish CLI Manifest
    needs: build-cli
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v1

      - name: Generate CLI Manifest JSON
        run: |
          VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-cli' }}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          cat <<EOF > cli-manifest.json
          {
            "version": "$VERSION",
            "provider": "cluaiz-app-foundry",
            "binaries": {
              "win-x64": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cli.exe",
              "linux-x64": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cli",
              "linux-arm64": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cli",
              "mac-arm64": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cli"
            }
          }
          EOF

      - name: Push CLI Manifest to GitHub Packages
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=ghcr.io/$OWNER/cluaiz-cli-manifest
          VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "FROM scratch" > Dockerfile
          echo "COPY cli-manifest.json /" >> Dockerfile
          
          docker build -t $IMAGE_ID:$VERSION .
          docker push $IMAGE_ID:$VERSION
          
          if [ "$VERSION" != "latest" ]; then
            docker tag $IMAGE_ID:$VERSION $IMAGE_ID:latest
            docker push $IMAGE_ID:latest
          fi
