name: Cluaiz CLI

on:
  push:
    paths:
      - 'Apps/cli/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ─── STAGE 1: CLI Compilation (EXTENDED MATRIX) ────────────────────
  build-cli:
    name: 🖥️ Build CLI [${{ matrix.target }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win-x64
            ext: exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            ext: binary
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            ext: binary
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: mac-arm64
            ext: binary

    steps:
      - name: Checkout Cluaiz
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI (Industrial Cross-Compile)
        uses: cross-rs/cross-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release -p cli
        env:
          OPENSSL_VENDORED: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/cli-') || github.event_name == 'workflow_dispatch'
        with:
          files: target/${{ matrix.target }}/release/cli*
          tag_name: cli-v0.1.0
          name: "Cluaiz CLI v0.1.0"
          body: |
            Cluaiz CLI v0.1.0
            
            Installation:
            Download the binary for your platform and add it to your PATH.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── STAGE 2: CLI Manifest Generation ──────────────────────────────
  publish-cli-manifest:
    name: Publish CLI Manifest
    needs: build-cli
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/cli-') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Cluaiz
        uses: actions/checkout@v4

      - name: Generate CLI Manifest JSON
        run: |
          VERSION="cli-v0.1.0"
          cat <<EOF > cli-manifest.json
          {
            "version": "$VERSION",
            "binaries": {
              "win-x64": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cli.exe",
              "linux-x64": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cli",
              "linux-arm64": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cli",
              "mac-arm64": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cli"
            }
          }
          EOF

      - name: 📦 Publish to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=ghcr.io/$OWNER/cluaiz-cli
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "FROM scratch" > Dockerfile
          echo "COPY cli-manifest.json /" >> Dockerfile
          
          docker build -t $IMAGE_ID:v0.1.0 .
          docker push $IMAGE_ID:v0.1.0
          docker tag $IMAGE_ID:v0.1.0 $IMAGE_ID:latest
          docker push $IMAGE_ID:latest
