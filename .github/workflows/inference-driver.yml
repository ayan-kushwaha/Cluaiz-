name: Cluaiz Drivers

on:
  push:
    paths:
      - 'interface-engines/drivers/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-drivers:
    name: Build Driver [${{ matrix.hardware }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: cuda
            os: windows-latest
            hardware: "NVIDIA CUDA"
          - driver: metal
            os: macos-latest
            hardware: "Apple Metal"
          - driver: rocm
            os: ubuntu-latest
            hardware: "AMD ROCm"
          - driver: vulkan
            os: windows-latest
            hardware: "Universal Vulkan"
          - driver: openvino
            os: ubuntu-latest
            hardware: "Intel OpenVINO"
          - driver: qnn
            os: windows-latest
            hardware: "Qualcomm QNN"
          - driver: tpu
            os: ubuntu-latest
            hardware: "Google TPU"
          - driver: cpu-blas
            os: ubuntu-latest
            hardware: "Generic CPU BLAS"
          - driver: ghost
            os: ubuntu-latest
            hardware: "Ghost Acceleration"

    steps:
      - name: Checkout Cluaiz
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Driver
        run: |
          DRIVER_TYPE="${{ matrix.driver }}"
          echo "Building real driver for $DRIVER_TYPE"
          mkdir -p artifacts
          
          # 🔍 Silicon Discovery: Copy real binaries if they exist in the repo
          # Structure: inference-drivers/drivers/<type>/<os>/<version>/*
          if [ -d "inference-drivers/drivers/$DRIVER_TYPE" ]; then
            cp -r inference-drivers/drivers/$DRIVER_TYPE/* artifacts/ || true
          fi
          
          # Fallback placeholder if still empty (for dev logs)
          if [ -z "$(ls -A artifacts)" ]; then
             echo "Sovereign Driver Package (Empty)" > artifacts/info.txt
          fi
        shell: bash

      - name: 📦 Zip Driver
        run: |
          mkdir -p dist/drivers
          zip -j "dist/drivers/cluaiz-driver-${{ matrix.driver }}.zip" artifacts/*
        shell: bash

      - name: Release Drivers
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/drivers-') || github.event_name == 'workflow_dispatch'
        with:
          files: dist/drivers/*.zip
          tag_name: ${{ github.ref_name || 'drivers-latest' }}
          name: "Cluaiz Drivers ${{ github.ref_name || 'Latest' }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-manifest:
    name: Publish Driver Manifest
    needs: build-drivers
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/drivers-') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Cluaiz
        uses: actions/checkout@v4

      - name: Generate Manifest
        run: |
          # 🎯 SYNC STRATEGY: VERSION must match the tag_name used in build-drivers
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == "main" || "$VERSION" == "master" ]]; then
            VERSION="drivers-v0.1.0"
          fi
          
          echo "Generating manifest for Sync-Version: $VERSION"
          
          cat <<EOF > driver-manifest.json
          {
            "version": "$VERSION",
            "install_root": "/Cluaiz/drivers/",
            "drivers": {
              "cuda": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-cuda.zip",
              "metal": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-metal.zip",
              "rocm": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-rocm.zip",
              "vulkan": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-vulkan.zip",
              "openvino": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-openvino.zip",
              "qnn": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-qnn.zip",
              "tpu": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-tpu.zip",
              "cpu-blas": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-cpu-blas.zip",
              "ghost": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-ghost.zip"
            },
            "automation": {
              "status": "ready",
              "installer_logic": "cluaiz calibrate driver:<type>"
            }
          }
          EOF

      - name: Upload Manifest to Release
        uses: softprops/action-gh-release@v2
        with:
          files: driver-manifest.json
          tag_name: ${{ github.ref_name == 'main' && 'drivers-v0.1.0' || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
