name: Cluaiz Drivers

on:
  push:
    paths:
      - 'interface-engines/drivers/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-drivers:
    name: Build Driver [${{ matrix.hardware }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            hardware: nvidia-cuda
            suffix: cuda
          - os: macos-latest
            hardware: apple-metal
            suffix: metal
          - os: ubuntu-latest
            hardware: amd-rocm
            suffix: rocm
          - os: windows-latest
            hardware: universal-vulkan
            suffix: vulkan

    steps:
      - name: Checkout Cluaiz
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Driver
        run: |
          echo "Building driver for ${{ matrix.hardware }}"
          # Compilation logic for drivers
          mkdir -p artifacts
          echo "Sovereign Driver Placeholder" > "artifacts/${{ matrix.suffix }}.txt"
        shell: bash

      - name: 📦 Zip Driver
        run: |
          mkdir -p dist/drivers
          mkdir -p artifacts
          echo "Sovereign Driver Placeholder" > "artifacts/placeholder.txt"
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a -tzip "dist/drivers/cluaiz-driver-${{ matrix.suffix }}.zip" ./artifacts/*
          else
            zip -j "dist/drivers/cluaiz-driver-${{ matrix.suffix }}.zip" artifacts/*
          fi
        shell: bash

      - name: Release Drivers
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/drivers-') || github.event_name == 'workflow_dispatch'
        with:
          files: dist/drivers/*.zip
          tag_name: drivers-v0.1.0
          name: "Cluaiz Drivers v0.1.0"
          body: |
            Hardware Acceleration Drivers for Cluaiz.
            
            ### 🚀 Quick Start
            ```bash
            cluaiz calibrate driver:${{ matrix.suffix }}
            ```
            *This will automatically install the correct hardware driver.*
            
            ### 📦 Manual Download
            Download the specific zip file below and extract it to your `/Cluaiz/interface-engines/` directory.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-manifest:
    name: Publish Driver Manifest
    needs: build-drivers
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Cluaiz
        uses: actions/checkout@v4

      - name: Generate Manifest
        run: |
          VERSION="drivers-v0.1.0"
          cat <<EOF > driver-manifest.json
          {
            "version": "$VERSION",
            "drivers": {
              "cuda": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-cuda.zip",
              "metal": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-metal.zip",
              "rocm": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-rocm.zip",
              "vulkan": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-vulkan.zip"
            }
          }
          EOF

      - name: Upload Manifest to Release
        uses: softprops/action-gh-release@v2
        with:
          files: driver-manifest.json
          tag_name: drivers-v0.1.0
          name: "Cluaiz Drivers v0.1.0"
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
