name: Cluaiz Drivers

on:
  push:
    paths:
      - 'interface-engines/drivers/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-drivers:
    name: Build Driver [${{ matrix.hardware }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            hardware: nvidia-cuda
            suffix: cuda
          - os: macos-latest
            hardware: apple-metal
            suffix: metal
          - os: ubuntu-latest
            hardware: amd-rocm
            suffix: rocm
          - os: windows-latest
            hardware: universal-vulkan
            suffix: vulkan

    steps:
      - name: Checkout Cluaiz
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Driver
        run: |
          echo "Building driver for ${{ matrix.hardware }}"
          # Compilation logic for drivers
        shell: bash

      - name: Release Drivers
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: artifacts/*
          tag_name: v0.1.0
          name: "Cluaiz Drivers v0.1.0"
          body: "Cluaiz Drivers v0.1.0 release."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-manifest:
    name: Publish Driver Manifest
    needs: build-drivers
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Cluaiz
        uses: actions/checkout@v4

      - name: Generate Manifest
        run: |
          VERSION="v0.1.0"
          cat <<EOF > driver-manifest.json
          {
            "version": "$VERSION",
            "drivers": {
              "cuda": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cuda.dll",
              "metal": "https://github.com/${{ github.repository }}/releases/download/$VERSION/metal.dylib",
              "vulkan": "https://github.com/${{ github.repository }}/releases/download/$VERSION/vulkan.dll"
            }
          }
          EOF

      - name: Push Manifest to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=ghcr.io/$OWNER/cluaiz-driver-manifest
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "FROM scratch" > Dockerfile
          echo "COPY driver-manifest.json /" >> Dockerfile
          
          docker build -t $IMAGE_ID:v0.1.0 .
          docker push $IMAGE_ID:v0.1.0
          docker tag $IMAGE_ID:v0.1.0 $IMAGE_ID:latest
          docker push $IMAGE_ID:latest
