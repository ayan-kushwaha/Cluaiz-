name: Cluaiz Drivers

on:
  push:
    paths:
      - 'interface-engines/drivers/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-drivers:
    name: Build Driver [${{ matrix.hardware }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        driver: [cuda, metal, rocm, vulkan, openvino, qnn, tpu, cpu-blas, ghost]
        os: [ubuntu-latest] # Default runner
        include:
          - driver: cuda
            os: windows-latest
            hardware: "NVIDIA CUDA"
          - driver: metal
            os: macos-latest
            hardware: "Apple Metal"
          - driver: rocm
            os: ubuntu-latest
            hardware: "AMD ROCm"
          - driver: vulkan
            os: windows-latest
            hardware: "Universal Vulkan"
          - driver: openvino
            os: ubuntu-latest
            hardware: "Intel OpenVINO"
          - driver: qnn
            os: windows-latest
            hardware: "Qualcomm QNN"
          - driver: tpu
            os: ubuntu-latest
            hardware: "Google TPU"
          - driver: cpu-blas
            os: ubuntu-latest
            hardware: "Generic CPU BLAS"
          - driver: ghost
            os: ubuntu-latest
            hardware: "Ghost Acceleration"

    steps:
      - name: Checkout Cluaiz
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Driver
        run: |
          echo "Building driver for ${{ matrix.hardware }}"
          # Compilation logic for drivers
          mkdir -p artifacts
          echo "Sovereign Driver Placeholder" > "artifacts/${{ matrix.driver }}.txt"
        shell: bash

      - name: 📦 Zip Driver
        run: |
          mkdir -p dist/drivers
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a -tzip "dist/drivers/cluaiz-driver-${{ matrix.driver }}.zip" ./artifacts/*
          else
            zip -j "dist/drivers/cluaiz-driver-${{ matrix.driver }}.zip" artifacts/*
          fi
        shell: bash

      - name: Release Drivers
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/drivers-') || github.event_name == 'workflow_dispatch'
        with:
          files: dist/drivers/*.zip
          tag_name: drivers-v0.1.0
          name: "Cluaiz Drivers v0.1.0"
          body: |
            Hardware Acceleration Drivers for Cluaiz.
            
            ### 🚀 Quick Start (Silicon Handshake)
            The `calibrate` command ensures the driver is properly tuned for your specific silicon and registered in the Sovereign kernel.
            ```bash
            cluaiz calibrate driver:${{ matrix.driver }}
            ```
            
            ### 📦 Manual Installation
            If you are not using the automatic installer, download the zip below and extract it to your `/Cluaiz/drivers/` directory.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-manifest:
    name: Publish Driver Manifest
    needs: build-drivers
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Cluaiz
        uses: actions/checkout@v4

      - name: Generate Manifest
        run: |
          VERSION="drivers-v0.1.0"
          cat <<EOF > driver-manifest.json
          {
            "version": "$VERSION",
            "install_root": "/Cluaiz/drivers/",
            "drivers": {
              "cuda": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-cuda.zip",
              "metal": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-metal.zip",
              "rocm": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-rocm.zip",
              "vulkan": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-vulkan.zip",
              "openvino": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-openvino.zip",
              "qnn": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-qnn.zip",
              "tpu": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-tpu.zip",
              "cpu-blas": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-cpu-blas.zip",
              "ghost": "https://github.com/${{ github.repository }}/releases/download/$VERSION/cluaiz-driver-ghost.zip"
            },
            "automation": {
              "status": "ready",
              "installer_logic": "cluaiz calibrate driver:<type>"
            }
          }
          EOF

      - name: Upload Manifest to Release
        uses: softprops/action-gh-release@v2
        with:
          files: driver-manifest.json
          tag_name: drivers-v0.1.0
          name: "Cluaiz Drivers v0.1.0"
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
