name: Cluaiz Drivers

on:
  push:
    paths:
      - 'interface-engines/drivers/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 🛡️ Sovereign Compliance: Suppress GitHub's internal Node.js 20 deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-drivers:
    name: Build Driver [${{ matrix.hardware }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: cuda
            os: windows-latest
            hardware: "NVIDIA CUDA"
          - driver: metal
            os: macos-latest
            hardware: "Apple Metal"
          - driver: rocm
            os: ubuntu-latest
            hardware: "AMD ROCm"
          - driver: hip
            os: ubuntu-latest
            hardware: "AMD HIP"
          - driver: sycl
            os: windows-latest
            hardware: "Intel SYCL"
          - driver: openvino
            os: ubuntu-latest
            hardware: "Intel OpenVINO"
          - driver: musa
            os: ubuntu-latest
            hardware: "Moore Threads MUSA"
          - driver: cann
            os: ubuntu-latest
            hardware: "Huawei CANN"
          - driver: qnn
            os: ubuntu-latest
            hardware: "Qualcomm QNN"
          - driver: hexagon
            os: ubuntu-latest
            hardware: "Qualcomm Hexagon"
          - driver: zdnn
            os: ubuntu-latest
            hardware: "IBM ZDNN"
          - driver: vulkan
            os: windows-latest
            hardware: "Universal Vulkan"
          - driver: blas
            os: ubuntu-latest
            hardware: "Generic BLAS"
          - driver: blis
            os: ubuntu-latest
            hardware: "Generic BLIS"
          - driver: rpc
            os: ubuntu-latest
            hardware: "Generic RPC"

    steps:
      - name: Checkout Cluaiz
        uses: actions/checkout@v4

      - name: Build Sovereign Driver (Simulation Strike)
        shell: bash
        run: |
          VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"
          DRIVER_TYPE="${{ matrix.driver }}"
          echo "🚀 Starting Industrial Build for $DRIVER_TYPE on ${{ matrix.os }}"
          mkdir -p artifacts
          
          OS_EXT=""
          case "${{ matrix.os }}" in
            windows-latest) OS_EXT=".dll" ;;
            ubuntu-latest)  OS_EXT=".so" ;;
            macos-latest)   OS_EXT=".dylib" ;;
          esac

          # Standardized Naming DNA
          TARGET_FILE="artifacts/cluaiz-driver-${VERSION}-${DRIVER_TYPE}${OS_EXT}"
          echo "Cluaiz Sovereign Driver [$DRIVER_TYPE] v${VERSION}" > "$TARGET_FILE"
          
          sha256sum "$TARGET_FILE" > "$TARGET_FILE.sha256"

      - name: 🚀 Release Drivers (Atomic Upload)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: "Cluaiz Release ${{ github.ref_name }}"
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-manifest:
    name: 📂 Publish Driver Manifest
    needs: build-drivers
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Cluaiz
        uses: actions/checkout@v4

      - name: Generate Driver Manifest JSON (Total Coverage)
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          TAG="${{ github.ref_name }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          
          # 🏛️ Total Coverage Driver Manifest
          cat <<EOF > driver-manifest.json
          {
            "version": "$VERSION",
            "drivers": {
              "cuda": "${BASE}/cluaiz-driver-$VERSION-cuda.dll",
              "metal": "${BASE}/cluaiz-driver-$VERSION-metal.dylib",
              "rocm": "${BASE}/cluaiz-driver-$VERSION-rocm.so",
              "hip": "${BASE}/cluaiz-driver-$VERSION-hip.so",
              "sycl": "${BASE}/cluaiz-driver-$VERSION-sycl.dll",
              "openvino": "${BASE}/cluaiz-driver-$VERSION-openvino.so",
              "musa": "${BASE}/cluaiz-driver-$VERSION-musa.so",
              "cann": "${BASE}/cluaiz-driver-$VERSION-cann.so",
              "qnn": "${BASE}/cluaiz-driver-$VERSION-qnn.so",
              "hexagon": "${BASE}/cluaiz-driver-$VERSION-hexagon.so",
              "zdnn": "${BASE}/cluaiz-driver-$VERSION-zdnn.so",
              "vulkan": "${BASE}/cluaiz-driver-$VERSION-vulkan.dll",
              "blas": "${BASE}/cluaiz-driver-$VERSION-blas.so",
              "blis": "${BASE}/cluaiz-driver-$VERSION-blis.so",
              "rpc": "${BASE}/cluaiz-driver-$VERSION-rpc.so"
            }
          }
          EOF

      - name: 🚀 Upload Manifest to Release
        uses: softprops/action-gh-release@v2
        with:
          files: driver-manifest.json
          tag_name: ${{ github.ref_name }}
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
