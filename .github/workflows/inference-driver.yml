name: "Cluaiz Interface Drivers"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0-alpha)'
        required: true
        default: 'dev-release'

permissions:
  contents: write

concurrency:
  group: "release-driver-${{ github.ref }}"
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── STAGE 1: Silicon Driver Compilation (GPU/NPU) ──────────────────
  build-drivers:
    name: "⚙️ Driver [${{ matrix.platform }}-${{ matrix.backend }}]"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- NVIDIA CUDA (Windows/Linux) ---
          - platform: win-x64
            backend: cuda
            cuda_v: "v13"
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: cuda
            ext: dll
            prefix: ""
          - platform: linux-x64
            backend: cuda
            cuda_v: "v13"
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: cuda
            ext: so
            prefix: "lib"

          # --- Apple Metal (Integrated) ---
          - platform: mac-arm64
            backend: metal
            os: macos-latest
            target: aarch64-apple-darwin
            features: metal
            ext: dylib
            prefix: "lib"
          - platform: ios-arm64
            backend: metal
            os: macos-latest
            target: aarch64-apple-ios
            features: metal
            ext: a
            prefix: "lib"

          # --- Universal Vulkan ---
          - platform: win-x64
            backend: vulkan
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: vulkan
            ext: dll
            prefix: ""
          - platform: linux-x64
            backend: vulkan
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: vulkan
            ext: so
            prefix: "lib"

          # --- Intel OpenVINO ---
          - platform: win-x64
            backend: openvino
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: openvino
            ext: dll
            prefix: ""
          - platform: linux-x64
            backend: openvino
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: openvino
            ext: so
            prefix: "lib"

          # --- AMD ROCm (Linux Only) ---
          - platform: linux-x64
            backend: rocm
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: hip
            ext: so
            prefix: "lib"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CUDA Toolkit
        if: matrix.backend == 'cuda'
        uses: jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.5.0'

      - name: Setup Vulkan SDK
        if: matrix.backend == 'vulkan'
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            curl -L "https://sdk.lunarg.com/sdk/download/1.3.204.1/windows/VulkanSDK-1.3.204.1-Installer.exe" -o VulkanSDK.exe
            ./VulkanSDK.exe --accept-licenses --default-answer --confirm-command install
          else
            sudo apt-get update && sudo apt-get install -y libvulkan-dev
          fi

      - name: Build Driver (Foundry)
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p llama --features "${{ matrix.features }}"

      - name: Prepare Driver Binary
        id: naming
        shell: bash
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || 'dev' }}"
          mkdir -p artifacts
          SRC="target/${{ matrix.target }}/release/${{ matrix.prefix }}cluaiz_llama.${{ matrix.ext }}"
          DEST="artifacts/cluaiz-driver-${VERSION}-${{ matrix.platform }}-${{ matrix.backend }}.${{ matrix.ext }}"
          cp "$SRC" "$DEST"
          echo "binary_path=${DEST}" >> $GITHUB_OUTPUT

      - name: 🚀 Release Driver
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: artifacts/*
          tag_name: "${{ github.event_name == 'workflow_dispatch' && format('driver-{0}', github.event.inputs.tag_name) || github.ref_name }}"
          name: "Cluaiz Interface Driver Release ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}"
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── STAGE 2: Registry Synchronization ──────────────────────────────
  publish-registry:
    name: 📂 Synchronize Driver Registry
    needs: build-drivers
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 💎 Hardened Registry Master Sync
        shell: bash
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}"
          TAG="driver-$VERSION"
          REG_PATH="inference-drivers/registry.json"
          
          sed -i "s|{DRIVER_TAG}|$TAG|g" $REG_PATH
          sed -i "s|{VERSION}|$VERSION|g" $REG_PATH
          
          cp $REG_PATH registry-synced.json

      - name: Upload Synced Registry
        uses: softprops/action-gh-release@v2
        with:
          files: registry-synced.json
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
