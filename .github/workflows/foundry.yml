name: 🏛️ Cluaiz Sovereign Foundry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Manual trigger for testing

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build & Package ${{ matrix.os }} Engine
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            suffix: win-x64
            ext: dll
          - os: ubuntu-latest
            suffix: linux-x64
            ext: so

    steps:
      - name: 🛰️ Checkout Sovereign Code
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🛠️ Build Sovereign Kernels
        run: cargo build --release -p engines

      - name: 📦 Create Package Bundle
        run: |
          mkdir -p dist
          cp target/release/*.${{ matrix.ext }} dist/ 2>/dev/null || :
          # Add extra assets (DNA, Configs)
          cp cluaiz-cure/engines/default_roster.json dist/
        shell: bash

      - name: 🚀 Publish to GitHub Packages
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          name: Cluaiz Sovereign Engines ${{ github.ref_name }}
          body: |
            ### 🏛️ Sovereign Release: ${{ github.ref_name }}
            This package contains pre-compiled kernels and drivers for Cluaiz-OS.
            - **OS:** ${{ matrix.os }}
            - **Platform:** ${{ matrix.suffix }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
