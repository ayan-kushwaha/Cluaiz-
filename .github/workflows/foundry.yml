name: Cluaiz Engine Foundry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-engines:
    name: Build ${{ matrix.target }} Engine
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win-x64
            ext: dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            ext: so
          - os: ubuntu-latest
            target: aarch64-linux-android
            suffix: android-arm64
            ext: so
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: mac-arm64
            ext: dylib
          - os: macos-latest
            target: aarch64-apple-ios
            suffix: ios-arm64
            ext: dylib

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Universal Kernel
        run: |
          cargo build --release -p engines --target ${{ matrix.target }}
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.suffix }}
          path: |
            target/${{ matrix.target }}/release/*.${{ matrix.ext }}
            cluaiz-cure/engines/default_roster.json

  publish-packages:
    name: Publish to Packages
    needs: build-engines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Engine Image
        run: |
          echo "FROM scratch" > Dockerfile
          echo "COPY dist/ /" >> Dockerfile
          
          RAW_ID="ghcr.io/${{ github.repository_owner }}/cluaiz-engines"
          IMAGE_ID=${RAW_ID,,}
          
          VERSION=${{ github.ref_name }}
          [ "$VERSION" == "main" ] && VERSION=latest

          docker build -t $IMAGE_ID:$VERSION .
          docker push $IMAGE_ID:$VERSION
        shell: bash
