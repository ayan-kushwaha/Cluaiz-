name: 🏛️ Cluaiz Sovereign Foundry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-engines:
    name: Build ${{ matrix.os }} Engine
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            suffix: win-x64
            ext: dll
          - os: ubuntu-latest
            suffix: linux-x64
            ext: so

    steps:
      - name: 🛰️ Checkout Code
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🛠️ Build
        run: cargo build --release -p engines

      - name: 📦 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.suffix }}
          path: |
            target/release/*.${{ matrix.ext }}
            cluaiz-cure/engines/default_roster.json

  publish-packages:
    name: 🚀 Publish to Packages (GHCR)
    needs: build-engines
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build & Push Engine Image
        run: |
          # Create a minimal Dockerfile to host our binaries
          echo "FROM scratch" > Dockerfile
          echo "COPY dist/ /" >> Dockerfile
          
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/cluaiz-engines
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[l-a-z]')
          VERSION=${{ github.ref_name }}
          [ "$VERSION" == "main" ] && VERSION=latest

          docker build -t $IMAGE_ID:$VERSION .
          docker push $IMAGE_ID:$VERSION
        shell: bash
