name: Cluaiz Inference Kernels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0-alpha)'
        required: true
        default: 'dev-release'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── STAGE 1: Silicon Compilation (HYPER MATRIX) ────────────────────
  build-kernels:
    name: ⚙️ Build [${{ matrix.platform }}-${{ matrix.backend }}${{ matrix.simd && format('-{0}', matrix.simd) || '' }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Windows NVIDIA CUDA (v13) ---
          - platform: win-x64
            backend: cuda
            cuda_v: "v13"
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: cuda
            ext: dll
            prefix: ""
            kernel: llama

          # --- Linux NVIDIA CUDA (v13) ---
          - platform: linux-x64
            backend: cuda
            cuda_v: "v13"
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: cuda
            ext: so
            prefix: "lib"
            kernel: llama

          # --- Apple Metal (ARM64) ---
          - platform: mac-arm64
            backend: metal
            os: macos-latest
            target: aarch64-apple-darwin
            features: metal
            ext: dylib
            prefix: "lib"
            kernel: llama

          # --- Apple Metal (Intel x64) ---
          - platform: mac-x64
            backend: metal
            os: macos-latest
            target: x86_64-apple-darwin
            features: metal
            ext: dylib
            prefix: "lib"
            kernel: llama

          # --- Android (Neon Optimized) ---
          - platform: android-arm64
            backend: cpu
            simd: neon
            os: ubuntu-latest
            target: aarch64-linux-android
            features: arm_neon
            ext: so
            prefix: "lib"
            kernel: llama

          # --- iOS Static ---
          - platform: ios-arm64
            backend: metal
            os: macos-latest
            target: aarch64-apple-ios
            features: metal
            ext: a
            prefix: "lib"
            kernel: llama

          # --- CPU SIMD Optimizations (Windows) ---
          - platform: win-x64
            backend: cpu
            simd: avx512
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
            ext: dll
            prefix: ""
            kernel: llama
          - platform: win-x64
            backend: cpu
            simd: avx2
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
            ext: dll
            prefix: ""
            kernel: llama

          # --- CPU SIMD Optimizations (Linux) ---
          - platform: linux-x64
            backend: cpu
            simd: avx512
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ""
            ext: so
            prefix: "lib"
            kernel: llama
          - platform: linux-x64
            backend: cpu
            simd: avx2
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ""
            ext: so
            prefix: "lib"
            kernel: llama

          # --- Specialized Backends ---
          - platform: win-x64
            backend: openvino
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: openvino
            ext: dll
            prefix: ""
            kernel: llama
          - platform: linux-x64
            backend: openvino
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: openvino
            ext: so
            prefix: "lib"
            kernel: llama
          - platform: win-x64
            backend: vulkan
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: vulkan
            ext: dll
            prefix: ""
            kernel: llama
          - platform: linux-x64
            backend: vulkan
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: vulkan
            ext: so
            prefix: "lib"
            kernel: llama

          # --- AMD ROCm/HIP (Linux) ---
          - platform: linux-x64
            backend: rocm
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: hip
            ext: so
            prefix: "lib"
            kernel: llama

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Cargo Registry & Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.backend }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-${{ matrix.backend }}-cargo-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure Git (Windows LongPaths)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CUDA Toolkit
        if: matrix.backend == 'cuda'
        id: cuda_toolkit
        uses: jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.5.0'
          method: 'network'

      # ── Hyper-Silicon SDKs (Modern & Validated) ──
      - name: Setup Vulkan SDK
        if: matrix.backend == 'vulkan'
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            curl -L "https://sdk.lunarg.com/sdk/download/1.3.204.1/windows/VulkanSDK-1.3.204.1-Installer.exe" -o VulkanSDK-Installer.exe
            ./VulkanSDK-Installer.exe --accept-licenses --default-answer --confirm-command install
            echo "VULKAN_SDK=C:\VulkanSDK\1.3.204.1" >> $GITHUB_ENV
          else
            sudo apt-get update && sudo apt-get install -y libvulkan-dev vulkan-tools
          fi

      - name: Setup OpenVINO (Intel)
        if: matrix.backend == 'openvino'
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            curl -fsSL https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --dearmor -o /usr/share/keyrings/intel-sw-products.gpg
            echo "deb [signed-by=/usr/share/keyrings/intel-sw-products.gpg] https://apt.repos.intel.com/openvino/2024 ubuntu22 main" | sudo tee /etc/apt/sources.list.d/intel-openvino-2024.list
            sudo apt-get update
            sudo apt-get install -y openvino-2024.3.0 || sudo apt-get install -y openvino
            echo "INTEL_OPENVINO_DIR=/opt/intel/openvino_2024" >> $GITHUB_ENV
          fi

      - name: Install Build Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang pkg-config

      - name: Ensure Xcode Tools (macOS / iOS)
        if: runner.os == 'macOS'
        run: xcode-select --install || true

      - name: Setup Android NDK (Modern)
        if: matrix.platform == 'android-arm64'
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          curl -L "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip" -o ndk.zip
          unzip -q ndk.zip
          NDK_PATH=$(pwd)/android-ndk-r25c
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup iOS Toolchain
        if: matrix.platform == 'ios-arm64'
        shell: bash
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDKROOT=${SDK_PATH}" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=clang" >> $GITHUB_ENV
          rustup target add aarch64-apple-ios

      # ── The Foundry Build ──
      - name: Build Kernel (Foundry Strike)
        shell: bash
        run: |
          RUSTFLAGS_SIMD=""
          if [ "${{ matrix.simd }}" == "avx512" ]; then RUSTFLAGS_SIMD="-C target-feature=+avx512f,+avx512bw,+avx512cd,+avx512dq,+avx512vl"; fi
          if [ "${{ matrix.simd }}" == "avx2" ]; then RUSTFLAGS_SIMD="-C target-feature=+avx2"; fi
          
          if [[ "${{ matrix.target }}" == *"-android"* ]]; then
            cargo install cross --git https://github.com/cross-rs/cross
            RUSTFLAGS="$RUSTFLAGS_SIMD" cross build --release --target ${{ matrix.target }} -p ${{ matrix.kernel }} --features "${{ matrix.features }}"
          else
            RUSTFLAGS="$RUSTFLAGS_SIMD" cargo build --release --target ${{ matrix.target }} -p ${{ matrix.kernel }} --features "${{ matrix.features }}"
          fi

      # ── Sovereign Binary Naming ──
      - name: Prepare Sovereign Binary
        id: naming
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"
          fi
          
          mkdir -p artifacts
          SIMD_TAG=""
          if [ -n "${{ matrix.simd }}" ]; then SIMD_TAG="-${{ matrix.simd }}"; fi
          CUDA_TAG=""
          if [ -n "${{ matrix.cuda_v }}" ]; then CUDA_TAG="-${{ matrix.cuda_v }}"; fi
          
          SRC="target/${{ matrix.target }}/release/${{ matrix.prefix }}cluaiz_${{ matrix.kernel }}.${{ matrix.ext }}"
          DEST="artifacts/cluaiz-llama-${VERSION}-${{ matrix.platform }}-${{ matrix.backend }}${SIMD_TAG}${CUDA_TAG}.${{ matrix.ext }}"
          
          cp "$SRC" "$DEST"
          echo "binary_path=${DEST}" >> $GITHUB_OUTPUT

      - name: 🚀 Release Kernels (Atomic Upload)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: artifacts/*
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('kernel-{0}', github.event.inputs.tag_name) || github.ref_name }}
          name: "Cluaiz Kernel Release ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}"
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── STAGE 2: Hyper-Registry Synchronization ─────────────────────────
  publish-registry:
    name: 📂 Synchronize Sovereign Registry
    needs: build-kernels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 💎 Hardened Registry Master Sync
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.tag_name }}"
            TAG="kernel-${{ github.event.inputs.tag_name }}"
          else
            VERSION="${{ github.ref_name }}"
            TAG="${{ github.ref_name }}"
          fi
          
          REG_PATH="inference-drivers/registry.json"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"
          GEN_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          sed -i "s|{BASE_URL}|$BASE_URL|g" $REG_PATH
          sed -i "s|{VERSION}|$VERSION|g" $REG_PATH
          sed -i "s|{GEN_TIME}|$GEN_TIME|g" $REG_PATH
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/g" $REG_PATH
          
          cp $REG_PATH registry-synced.json

      - name: Upload Synced Registry to Release
        uses: softprops/action-gh-release@v2
        with:
          files: registry-synced.json
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
