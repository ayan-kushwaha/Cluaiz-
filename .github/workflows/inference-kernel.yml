name: Cluaiz Inference Kernels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# 🛡️ Prevent parallel release uploads from conflicting
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 4

jobs:
  # ─── STAGE 1: Silicon Compilation (FULL MATRIX) ─────────────────────
  build-kernels:
    name: ⚙️ Build [${{ matrix.kernel }}-${{ matrix.platform }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        kernel: [llama, candle]
        platform: [win-x64, linux-x64, android-arm64, mac-arm64, ios-arm64]
        include:
          - platform: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: dll
            prefix: ""
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: so
            prefix: "lib"
          - platform: android-arm64
            os: ubuntu-latest
            target: aarch64-linux-android
            ext: so
            prefix: "lib"
          - platform: mac-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: dylib
            prefix: "lib"
          - platform: ios-arm64
            os: macos-latest
            target: aarch64-apple-ios
            ext: a
            prefix: "lib"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Cargo Cache ──
      - name: Cache Cargo Registry & Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            interface-engines/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('interface-engines/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── Cross-Compilation Prerequisites ──
      - name: Install Build Tools (Linux)
        if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang pkg-config

      - name: Ensure Xcode Tools (macOS / iOS)
        if: matrix.platform == 'mac-arm64' || matrix.platform == 'ios-arm64'
        run: xcode-select --install || true

      - name: Setup Android NDK
        if: matrix.platform == 'android-arm64'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Configure Android Environment
        if: matrix.platform == 'android-arm64'
        shell: bash
        run: |
          NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "${NDK_BIN}" >> $GITHUB_PATH
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_BIN}/aarch64-linux-android23-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android23-clang" >> $GITHUB_ENV

      - name: Setup iOS Toolchain
        if: matrix.platform == 'ios-arm64'
        shell: bash
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDKROOT=${SDK_PATH}" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS=-C link-arg=-isysroot -C link-arg=${SDK_PATH} -C link-arg=-lSystem" >> $GITHUB_ENV
          rustup target add aarch64-apple-ios

      # ── The Foundry Build ──
      - name: Build Kernel [${{ matrix.kernel }}]
        shell: bash
        working-directory: interface-engines
        run: |
          cargo build --release --verbose --target ${{ matrix.target }} -p archer-${{ matrix.kernel }}

      # ── Sovereign Binary Naming ──
      - name: Prepare Sovereign Binary
        id: naming
        shell: bash
        run: |
          VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"
          ORIGINAL="${{ matrix.prefix }}archer_${{ matrix.kernel }}.${{ matrix.ext }}"
          RENAMED="${{ matrix.prefix }}archer_${{ matrix.kernel }}-${VERSION}-${{ matrix.platform }}.${{ matrix.ext }}"

          SRC="interface-engines/target/${{ matrix.target }}/release/${ORIGINAL}"
          DEST="interface-engines/target/${{ matrix.target }}/release/${RENAMED}"

          # 🛡️ Safety: Verify binary exists before renaming
          if [ ! -f "$SRC" ]; then
            echo "❌ ERROR: Binary not found at: $SRC"
            echo "Available files in release dir:"
            ls -la "interface-engines/target/${{ matrix.target }}/release/" || true
            exit 1
          fi

          # 🔪 Strip debug symbols (Linux/Android/macOS only)
          if [[ "${{ matrix.platform }}" != "win-x64" ]]; then
            strip "$SRC" || true
          fi

          mv "$SRC" "$DEST"
          echo "binary_path=${DEST}" >> $GITHUB_OUTPUT
          echo "binary_name=${RENAMED}" >> $GITHUB_OUTPUT

      # ── Upload to GitHub Releases ──
      - name: Upload Kernel Binary
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ steps.naming.outputs.binary_path }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-kernels' }}
          name: "Cluaiz Interface Engines"
          body: "Pre-compiled Neural Kernels for Cluaiz. Optimized for silicon-native execution."
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── STAGE 2: Neural Manifest Generation ─────────────────────────────
  publish-manifest:
    name: 📂 Publish Kernel Manifest
    needs: build-kernels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Manifest JSON
        shell: bash
        run: |
          VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-kernels' }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${VERSION}"

          cat <<EOF > kernel-manifest.json
          {
            "version": "${VERSION}",
            "provider": "cluaiz-foundry",
            "kernels": {
              "llama": {
                "win-x64": "${BASE}/archer_llama-${VERSION}-win-x64.dll",
                "linux-x64": "${BASE}/libarcher_llama-${VERSION}-linux-x64.so",
                "android-arm64": "${BASE}/libarcher_llama-${VERSION}-android-arm64.so",
                "mac-arm64": "${BASE}/libarcher_llama-${VERSION}-mac-arm64.dylib",
                "ios-arm64": "${BASE}/libarcher_llama-${VERSION}-ios-arm64.a"
              },
              "candle": {
                "win-x64": "${BASE}/archer_candle-${VERSION}-win-x64.dll",
                "linux-x64": "${BASE}/libarcher_candle-${VERSION}-linux-x64.so",
                "android-arm64": "${BASE}/libarcher_candle-${VERSION}-android-arm64.so",
                "mac-arm64": "${BASE}/libarcher_candle-${VERSION}-mac-arm64.dylib",
                "ios-arm64": "${BASE}/libarcher_candle-${VERSION}-ios-arm64.a"
              }
            }
          }
          EOF

      - name: Upload Manifest to Release
        uses: softprops/action-gh-release@v2
        with:
          files: kernel-manifest.json
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-kernels' }}
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
