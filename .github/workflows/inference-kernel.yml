name: Cluaiz Inference Kernels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 4

jobs:
  # ─── STAGE 1: Silicon Compilation (HYPER MATRIX) ────────────────────
  build-kernels:
    name: ⚙️ Build [${{ matrix.kernel }}-${{ matrix.platform }}-${{ matrix.backend }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        kernel: [llama, candle]
        platform: [win-x64, linux-x64, android-arm64, mac-arm64, ios-arm64]
        include:
          - platform: win-x64
            backend: cuda
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: cuda
            ext: dll
            prefix: ""
          - platform: linux-x64
            backend: cuda
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: cuda
            ext: so
            prefix: "lib"
          - platform: android-arm64
            backend: qnn
            os: ubuntu-latest
            target: aarch64-linux-android
            features: qnn
            ext: so
            prefix: "lib"
          - platform: mac-arm64
            backend: metal
            os: macos-latest
            target: aarch64-apple-darwin
            features: metal
            ext: dylib
            prefix: "lib"
          - platform: ios-arm64
            backend: metal
            os: macos-latest
            target: aarch64-apple-ios
            features: metal
            ext: a
            prefix: "lib"
          # Extra rule for OpenVINO (Linux only)
          - platform: linux-x64
            backend: openvino
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: openvino
            ext: so
            prefix: "lib"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Cargo Registry & Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            interface-engines/target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.backend }}-cargo-${{ hashFiles('interface-engines/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-${{ matrix.backend }}-cargo-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure Git (Windows LongPaths)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CUDA Toolkit
        if: matrix.backend == 'cuda'
        uses: jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.2.0'
          method: 'network'

      - name: Setup OpenVINO Repository (Linux)
        if: matrix.backend == 'openvino'
        run: |
          curl -fsSL https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --dearmor -o /usr/share/keyrings/intel-sw-products.gpg
          echo "deb [signed-by=/usr/share/keyrings/intel-sw-products.gpg] https://apt.repos.intel.com/openvino/2024 ubuntu22 main" | sudo tee /etc/apt/sources.list.d/intel-openvino-2024.list
          sudo apt-get update

      # ── Hyper-Silicon SDKs ──
      - name: Setup OpenVINO (Intel)
        if: matrix.backend == 'openvino'
        run: |
          sudo apt-get install -y intel-openvino-runtime-ubuntu22-2024*
          # Find the exact path where it was installed
          OV_INSTALL_DIR=$(ls -d /opt/intel/openvino_2024* | head -n 1)
          echo "INTEL_OPENVINO_DIR=$OV_INSTALL_DIR" >> $GITHUB_ENV

      - name: Install Build Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang pkg-config

      - name: Ensure Xcode Tools (macOS / iOS)
        if: runner.os == 'macOS'
        run: xcode-select --install || true

      - name: Setup Android NDK
        if: matrix.platform == 'android-arm64'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Configure Android Environment
        if: matrix.platform == 'android-arm64'
        shell: bash
        run: |
          NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "${NDK_BIN}" >> $GITHUB_PATH
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_BIN}/aarch64-linux-android23-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android23-clang" >> $GITHUB_ENV

      - name: Setup iOS Toolchain
        if: matrix.platform == 'ios-arm64'
        shell: bash
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDKROOT=${SDK_PATH}" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS=-C link-arg=-isysroot -C link-arg=${SDK_PATH} -C link-arg=-lSystem" >> $GITHUB_ENV
          rustup target add aarch64-apple-ios

      # ── The Foundry Build ──
      - name: Build Kernel [${{ matrix.kernel }}] (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        working-directory: interface-engines
        run: |
          @echo off
          if "${{ matrix.backend }}" == "cuda" (
            set CUDA_COMPUTE_CAP=80
            set CUDA_PATH=%CUDA_PATH%
          )
          cargo build --release --verbose --target ${{ matrix.target }} -p archer-${{ matrix.kernel }} --features ${{ matrix.features }}

      - name: Build Kernel [${{ matrix.kernel }}] (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        working-directory: interface-engines
        run: |
          cargo build --release --verbose --target ${{ matrix.target }} -p archer-${{ matrix.kernel }} --features ${{ matrix.features }}

      # ── 🔬 THE SOVEREIGN AUDIT (Symbol Verification) ──
      - name: Audit Exported Symbols
        shell: bash
        run: |
          BINARY="interface-engines/target/${{ matrix.target }}/release/${{ matrix.prefix }}archer_${{ matrix.kernel }}.${{ matrix.ext }}"
          
          echo "🔍 Auditing binary: $BINARY"
          
          if [[ "${{ matrix.platform }}" == "win-x64" ]]; then
            # Windows Audit: Be resilient if tools are missing
            echo "🔍 DEBUG: Verifying Windows DLL symbols..."
            if command -v strings >/dev/null 2>&1; then
              strings "$BINARY" | grep "archer_kernel_init" || (echo "❌ ERROR: archer_kernel_init not found in Windows DLL" && exit 1)
            else
              echo "⚠️ Warning: 'strings' not found, verifying file existence only."
              ls -l "$BINARY"
            fi
          elif [[ "${{ matrix.platform }}" == "mac-arm64" || "${{ matrix.platform }}" == "ios-arm64" ]]; then
            # Apple Audit (Resilient Strings Method)
            echo "🔍 DEBUG: Verifying symbols via strings..."
            strings "$BINARY" | grep -E "archer_kernel_init|_archer_kernel_init" || (echo "❌ ERROR: archer_kernel_init not found in Apple binary" && exit 1)
          else
            # Linux/Android Audit
            nm -D "$BINARY" | grep "archer_kernel_init" || (echo "❌ ERROR: archer_kernel_init not found in Linux/Android Shared Lib" && exit 1)
          fi
          
          echo "✅ Handshake symbol 'archer_kernel_init' verified."

      # ── Sovereign Binary Naming ──
      - name: Prepare Sovereign Binary
        id: naming
        shell: bash
        run: |
          VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"
          ORIGINAL="${{ matrix.prefix }}archer_${{ matrix.kernel }}.${{ matrix.ext }}"
          RENAMED="${{ matrix.prefix }}archer_${{ matrix.kernel }}-${VERSION}-${{ matrix.platform }}-${{ matrix.backend }}.${{ matrix.ext }}"

          SRC="interface-engines/target/${{ matrix.target }}/release/${ORIGINAL}"
          DEST="interface-engines/target/${{ matrix.target }}/release/${RENAMED}"

          if [ ! -f "$SRC" ]; then
            echo "❌ ERROR: Binary not found at: $SRC"
            exit 1
          fi

          if [[ "${{ matrix.platform }}" != "win-x64" ]]; then
            strip "$SRC" || true
          fi

          mv "$SRC" "$DEST"
          echo "binary_path=${DEST}" >> $GITHUB_OUTPUT
          echo "binary_name=${RENAMED}" >> $GITHUB_OUTPUT

      - name: Upload Kernel Binary
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ steps.naming.outputs.binary_path }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-kernels' }}
          name: "Cluaiz Interface Engines"
          body: "Pre-compiled Hyper-Silicon Neural Kernels for Cluaiz. Optimized for NPU/GPU/CPU."
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── STAGE 2: Hyper-Manifest Generation ─────────────────────────────
  publish-manifest:
    name: 📂 Publish Hyper-Manifest
    needs: build-kernels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Manifest JSON
        shell: bash
        run: |
          VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-kernels' }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${VERSION}"

          cat <<EOF > kernel-manifest.json
          {
            "version": "${VERSION}",
            "provider": "cluaiz-hyper-foundry",
            "kernels": {
              "llama": {
                "win-x64-cuda": "${BASE}/archer_llama-${VERSION}-win-x64-cuda.dll",
                "linux-x64-cuda": "${BASE}/libarcher_llama-${VERSION}-linux-x64-cuda.so",
                "linux-x64-openvino": "${BASE}/libarcher_llama-${VERSION}-linux-x64-openvino.so",
                "android-arm64-qnn": "${BASE}/libarcher_llama-${VERSION}-android-arm64-qnn.so",
                "mac-arm64-metal": "${BASE}/libarcher_llama-${VERSION}-mac-arm64-metal.dylib",
                "ios-arm64-metal": "${BASE}/libarcher_llama-${VERSION}-ios-arm64-metal.a"
              },
              "candle": {
                "win-x64-cuda": "${BASE}/archer_candle-${VERSION}-win-x64-cuda.dll",
                "linux-x64-cuda": "${BASE}/libarcher_candle-${VERSION}-linux-x64-cuda.so",
                "linux-x64-openvino": "${BASE}/libarcher_candle-${VERSION}-linux-x64-openvino.so",
                "android-arm64-qnn": "${BASE}/libarcher_candle-${VERSION}-android-arm64-qnn.so",
                "mac-arm64-metal": "${BASE}/libarcher_candle-${VERSION}-mac-arm64-metal.dylib",
                "ios-arm64-metal": "${BASE}/libarcher_candle-${VERSION}-ios-arm64-metal.a"
              }
            }
          }
          EOF

      - name: Upload Manifest to Release
        uses: softprops/action-gh-release@v2
        with:
          files: kernel-manifest.json
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-kernels' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
