name: Cluaiz Skills

on:
  push:
    paths:
      - 'skills/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cluaiz
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip

      - name: Package Skills
        id: build_library
        run: |
          mkdir -p dist/library
          echo "{\"version\": \"v0.1.0\", \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"skills\": []}" > dist/skills.json

          find skills -name "manifest.json" | while read manifest_path; do
            skill_dir=$(dirname "$manifest_path")
            skill_id=$(jq -r '.id' "$manifest_path")
            skill_name=$(basename "$skill_dir")
            
            zip_name="${skill_id}.zip"
            (cd "$skill_dir" && zip -r "../../../dist/library/$zip_name" .)
            
            jq --arg id "$skill_id" \
               --arg name "$skill_name" \
               --arg zip "$zip_name" \
               --arg desc "$(jq -r '.description' "$manifest_path")" \
               '.skills += [{id: $id, name: $name, url: "https://github.com/${{ github.repository }}/releases/download/skills-v0.1.0/\($zip)", description: $desc}]' \
               dist/skills.json > dist/tmp.json && mv dist/tmp.json dist/skills.json
          done

      - name: 🚀 Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/skills-') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: skills-v0.1.0
          name: "Cluaiz Skills v0.1.0"
          body: |
            ## Cluaiz Skills v0.1.0
            
            Distributed Neural Plugins for Cluaiz-OS.
            
            ### 🚀 Quick Start
            ```bash
            cluaiz run skill:<skill_id>
            ```
            *This will automatically pull and activate the neural plugin.*
            
            ### 📦 Manual Download
            Download the zip files below and place them in your `skills/` directory.
          files: |
            dist/library/*.zip
            dist/skills.json
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Publish to GHCR
        if: startsWith(github.ref, 'refs/tags/skills-') || github.event_name == 'workflow_dispatch'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=ghcr.io/$OWNER/cluaiz-skills
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "FROM scratch" > Dockerfile
          echo "LABEL org.opencontainers.image.source=https://github.com/${{ github.repository }}" >> Dockerfile
          echo "LABEL org.opencontainers.image.description='Distributed Neural Plugins (Skills) for Cluaiz-OS'" >> Dockerfile
          echo "COPY dist/library/ /skills/" >> Dockerfile
          echo "COPY dist/skills.json /" >> Dockerfile
          
          docker build -t $IMAGE_ID:v0.1.0 .
          docker push $IMAGE_ID:v0.1.0
          docker tag $IMAGE_ID:v0.1.0 $IMAGE_ID:latest
          docker push $IMAGE_ID:latest
