name: "Cluaize ONNX Interface Kernel"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0-alpha)'
        required: true
        default: 'alpha-release'

permissions:
  contents: write

concurrency:
  group: "release-kernel-${{ github.ref }}"
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── STAGE 1: Silicon Kernel Compilation (9 OS) ────────────────────
  build-kernels:
    name: "⚙️ Kernel [${{ matrix.platform }}]"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Windows CPU Kernels ---
          - platform: win-x64-avx512
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
            ext: dll
            prefix: ""
          - platform: win-x64-avx2
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
            ext: dll
            prefix: ""

          # --- Linux CPU Kernels ---
          - platform: linux-x64-avx512
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ""
            ext: so
            prefix: "lib"
          - platform: linux-x64-avx2
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ""
            ext: so
            prefix: "lib"

          # --- Apple Silicon Kernels (Mac) ---
          - platform: mac-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            features: ""
            ext: dylib
            prefix: "lib"
          - platform: mac-x64
            os: macos-latest
            target: x86_64-apple-darwin
            features: ""
            ext: dylib
            prefix: "lib"

          # --- Mobile Kernels (CPU) ---
          - platform: android-arm64
            os: ubuntu-latest
            target: aarch64-linux-android
            features: "arm_neon"
            ext: so
            prefix: "lib"
          - platform: ios-arm64
            os: macos-latest
            target: aarch64-apple-ios
            features: ""
            ext: a
            prefix: "lib"
          - platform: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            features: "arm_neon"
            ext: so
            prefix: "lib"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Cargo Registry & Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-kernel-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-kernel-cargo-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure Git (Windows LongPaths)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Build Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang pkg-config

      - name: Setup Android NDK (Modern)
        if: matrix.platform == 'android-arm64'
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          curl -L "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip" -o ndk.zip
          unzip -q ndk.zip
          NDK_PATH=$(pwd)/android-ndk-r25c
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup iOS Toolchain
        if: matrix.platform == 'ios-arm64'
        shell: bash
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDKROOT=${SDK_PATH}" >> $GITHUB_ENV
          echo "IPHONEOS_DEPLOYMENT_TARGET=16.0" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=clang" >> $GITHUB_ENV
          rustup target add aarch64-apple-ios

      # ── The Foundry Kernel Build ──
      - name: Build Kernel (Foundry Strike)
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            rm -f /usr/bin/link
          fi
          if [[ "${{ matrix.target }}" == *"-android"* || "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            cargo install cross --git https://github.com/cross-rs/cross
            cross build --release --target ${{ matrix.target }} -p onnx --features "${{ matrix.features }}"
          else
            cargo build --release --target ${{ matrix.target }} -p onnx --features "${{ matrix.features }}"
          fi

      # ── Sovereign Kernel Naming ──
      - name: Prepare Sovereign Kernel
        id: naming
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"
          fi
          
          mkdir -p artifacts
          SRC="target/${{ matrix.target }}/release/${{ matrix.prefix }}cluaize_onnx.${{ matrix.ext }}"
          DEST="artifacts/cluaize-onnx-kernel-${VERSION}-${{ matrix.platform }}.${{ matrix.ext }}"
          
          cp "$SRC" "$DEST"
          echo "binary_path=${DEST}" >> $GITHUB_OUTPUT

      - name: 🚀 Release Kernels (Atomic Isolation)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: artifacts/*
          tag_name: "${{ github.event_name == 'workflow_dispatch' && format('onnx-kernel-{0}', github.event.inputs.tag_name) || github.ref_name }}"
          name: "Cluaize ONNX Kernel Release ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}"
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── STAGE 2: Registry Synchronization ──────────────────────────────
  publish-registry:
    name: 📂 Synchronize Kernel Registry
    needs: build-kernels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Kernel Manifest JSON
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.tag_name }}"
            TAG="kernel-${{ github.event.inputs.tag_name }}"
          else
            VERSION="${{ github.ref_name }}"
            TAG="${{ github.ref_name }}"
          fi
          
          cat << 'EOF' > generate_manifest.py
          import urllib.request, json, sys, os

          version = sys.argv[1]
          repo = sys.argv[2]
          tag = sys.argv[3]
          token = os.environ.get("GITHUB_TOKEN")
          url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          
          req = urllib.request.Request(url)
          req.add_header("Accept", "application/vnd.github.v3+json")
          if token: req.add_header("Authorization", f"token {token}")
          
          try:
              with urllib.request.urlopen(req) as response:
                  assets = json.loads(response.read().decode()).get("assets", [])
          except Exception as e:
              print(f"Manifest API Notice: {e}")
              assets = []

          data = { "version": version, "kernels": {} }
          for a in assets:
              name = a["name"]
              if name.endswith(".json"): continue
              if name.startswith("cluaize-onnx-kernel-") or name.startswith("libcluaize-onnx-kernel-"):
                  parts = name.split(f"-{version}-")
                  if len(parts) > 1:
                      key = parts[-1].rsplit(".", 1)[0]
                      data["kernels"][key] = a["browser_download_url"]
          
          with open("cluaize-onnx-kernel.json", "w") as out:
              json.dump(data, out, indent=2)
          EOF

          python3 generate_manifest.py "$VERSION" "${{ github.repository }}" "$TAG"
          python3 .github/scripts/registry_aggregator.py "kernel_onnx" "$VERSION" "${{ github.repository }}" "$TAG"

      - name: 🚀 Upload Manifest to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cluaize-onnx-kernel.json
            cluaize-package-registry.json
          tag_name: "${{ github.event_name == 'workflow_dispatch' && format('onnx-kernel-{0}', github.event.inputs.tag_name) || github.ref_name }}"
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
