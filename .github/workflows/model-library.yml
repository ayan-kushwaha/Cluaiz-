name: Cluaiz Models Library

on:
  push:
    paths:
      - 'models/library/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-library:
    name: 📂 Sync & Publish Model Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v1

      - name: Validate Model Library
        run: |
          echo "Validating Sovereign Model DNA..."
          ls -R models/library/

      - name: Create Bundle Artifact
        run: |
          zip -r model-library-bundle.zip models/library/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: model-library-bundle.zip
          name: "Cluaiz Models Library (Baseline)"
          tag_name: ${{ github.ref_name == 'main' && 'latest-library' || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Library to GHCR
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          # Industrial Stabilization: Force Lowercase for GHCR
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=ghcr.io/$OWNER/cluaiz-model-library
          
          # Use tag name or fallback to 'latest' for manual runs
          VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "FROM scratch" > Dockerfile
          echo "LABEL org.opencontainers.image.source=https://github.com/${{ github.repository }}" >> Dockerfile
          echo "LABEL org.opencontainers.image.description='Cluaiz Sovereign Model Library'" >> Dockerfile
          echo "COPY models/library/ /library/" >> Dockerfile
          
          docker build -t $IMAGE_ID:$VERSION .
          docker push $IMAGE_ID:$VERSION
          
          if [ "$VERSION" != "latest" ]; then
            docker tag $IMAGE_ID:$VERSION $IMAGE_ID:latest
            docker push $IMAGE_ID:latest
          fi
