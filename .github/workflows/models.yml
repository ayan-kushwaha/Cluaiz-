name: Cluaiz Models Library

on:
  push:
    paths:
      - 'models/library/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-library:
    name: 📂 Sync & Publish Model Library
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Checkout Cluaiz-OS
        uses: actions/checkout@v4

      - name: Setup Tools
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - name: Package Individual Models
        id: build_models
        run: |
          mkdir -p dist/models
          echo "{\"version\": \"v0.1.0\", \"models\": []}" > dist/models.json

          find models/library -maxdepth 1 -mindepth 1 -type d | while read model_dir; do
            model_name=$(basename "$model_dir")
            zip_name="${model_name}.zip"
            echo "📦 Packaging model: $model_name"
            (cd "$model_dir" && zip -r "../../../dist/models/$zip_name" .)
            
            jq --arg name "$model_name" \
               --arg zip "$zip_name" \
               '.models += [{id: $name, name: $name, url: "https://github.com/${{ github.repository }}/releases/download/models-v0.1.0/\($zip)"}]' \
               dist/models.json > dist/tmp.json && mv dist/tmp.json dist/models.json
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/models/*.zip
            dist/models.json
          name: "Cluaiz Models v0.1.0"
          tag_name: models-v0.1.0
          body: |
            Model Library for Cluaiz.
            
            ### 🚀 Quick Start
            ```bash
            cluaiz run model:<model_id>
            ```
            *This will automatically pull and initialize the model.*
            
            ### 📦 Manual Download
            Download the specific model zip file below and extract it to your `/Cluaiz/models/` directory.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Library to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=ghcr.io/$OWNER/cluaiz-model-library
          VERSION="v0.1.0"
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "FROM scratch" > Dockerfile
          echo "LABEL org.opencontainers.image.source=https://github.com/${{ github.repository }}" >> Dockerfile
          echo "LABEL org.opencontainers.image.description='Cluaiz Ai Sovereign Model Library'" >> Dockerfile
          echo "COPY dist/models/ /library/" >> Dockerfile
          echo "COPY dist/models.json /" >> Dockerfile
          
          docker build -t $IMAGE_ID:$VERSION .
          docker push $IMAGE_ID:$VERSION
          docker tag $IMAGE_ID:$VERSION $IMAGE_ID:latest
          docker push $IMAGE_ID:latest
