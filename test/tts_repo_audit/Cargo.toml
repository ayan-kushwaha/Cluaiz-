[package]
name = "tts_repo_audit"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
engines = { path = "../../inference-engine/engines" }
reqwest = { version = "0.11.27", features = ["json"] }

[[bin]]
name = "tts_repo_audit"
path = "src/main.rs"

[[bin]]
name = "raw_tree_prober"
path = "src/main_prober.rs"

