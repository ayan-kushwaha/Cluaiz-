[workspace]
members = [
    "inference-engine/api",
    "inference-engine/engines",
    "inference-engine/engines/cluaize-shared",
    "inference-engine/engines/system-booster",
    "cmd"
]

resolver = "2"

[workspace.package]
version = "0.0.1-alpha"
edition = "2021"
authors = ["Cluaiz Technologies"]

[profile.dev]
debug = false
split-debuginfo = "off"
