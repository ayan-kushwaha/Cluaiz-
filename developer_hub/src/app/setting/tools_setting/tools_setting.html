<div class="settings-module" id="tools_setting">
    <h3 class="settings-section-title">Installed Tools & Plugins</h3>
    
    <!-- Filter Tabs -->
    <div class="settings-tabs" style="display: flex; gap: 12px; margin-bottom: 24px; padding: 4px; background: rgba(0, 0, 0, 0.2); border-radius: 8px; border: 1px solid var(--border-color); width: fit-content;">
        <button class="setting-tab-btn active" data-filter="all" style="background: var(--accent-color, #3b82f6); color: #fff; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: all 0.2s;">All</button>
        <button class="setting-tab-btn" data-filter="skill" style="background: transparent; color: var(--text-secondary); border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: all 0.2s;" onmouseover="if(!this.classList.contains('active')) this.style.color='var(--text-primary)'" onmouseout="if(!this.classList.contains('active')) this.style.color='var(--text-secondary)'">Skills</button>
        <button class="setting-tab-btn" data-filter="plugin" style="background: transparent; color: var(--text-secondary); border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: all 0.2s;" onmouseover="if(!this.classList.contains('active')) this.style.color='var(--text-primary)'" onmouseout="if(!this.classList.contains('active')) this.style.color='var(--text-secondary)'">Plugins</button>
        <button class="setting-tab-btn" data-filter="mcp" style="background: transparent; color: var(--text-secondary); border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: all 0.2s;" onmouseover="if(!this.classList.contains('active')) this.style.color='var(--text-primary)'" onmouseout="if(!this.classList.contains('active')) this.style.color='var(--text-secondary)'">MCP</button>
    </div>

    <div id="tools-list" style="display: flex; flex-direction: column; gap: 16px;">

        <!-- Dynamically populated by JS -->
    </div>

    <!-- File Editor Modal -->
    <div id="tool-editor-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; width: 90%; max-width: 1000px; height: 80vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
            <div style="padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2);">
                <h3 id="tool-editor-title" style="margin: 0; font-size: 1.1rem; color: var(--text-primary);">Configure Tool</h3>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="setting-toggle" id="modal-tool-toggle">
                        <div class="setting-toggle-thumb"></div>
                    </div>
                    <button id="tool-editor-close" class="icon-btn text-red-500" style="background: transparent; border: none; cursor: pointer;">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            
            <div style="display: flex; flex: 1; overflow: hidden;">
                <!-- Left Pane: Folder structure & Actions -->
                <div style="width: 250px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; background: rgba(0,0,0,0.1);">
                    <div style="padding: 12px; font-weight: bold; border-bottom: 1px solid var(--border-color); color: var(--text-primary); font-size: 0.9rem;">Files</div>
                    <div id="tool-file-tree" style="flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
                        <!-- Dynamically populated file tree -->
                    </div>
                    
                    <div style="padding: 12px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px;">
                        <button id="btn-clear-temp" style="background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); padding: 8px; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; justify-content: center;" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-secondary)'"><i data-lucide="eraser" class="w-4 h-4"></i> Clear Temp Cache</button>
                        <button id="btn-clear-all" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; justify-content: center;" onmouseover="this.style.background='rgba(239, 68, 68, 0.2)'" onmouseout="this.style.background='rgba(239, 68, 68, 0.1)'"><i data-lucide="trash" class="w-4 h-4"></i> Clear All Cache</button>
                        <button id="btn-uninstall" style="background: #ef4444; color: #fff; border: none; padding: 8px; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; justify-content: center; margin-top: 8px;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'"><i data-lucide="trash-2" class="w-4 h-4"></i> Uninstall</button>
                    </div>
                </div>

                <!-- Right Pane: File Viewer -->
                <div style="flex: 1; padding: 16px; display: flex; flex-direction: column;">
                    <div id="file-viewer-title" style="margin-bottom: 12px; font-weight: 500; color: var(--text-secondary); font-size: 0.9rem;">Select a file to view</div>
                    <textarea id="tool-editor-textarea" style="width: 100%; flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-family: 'Courier New', Courier, monospace; font-size: 14px; padding: 12px; resize: none; outline: none; box-sizing: border-box;" readonly></textarea>
                </div>
            </div>
        </div>
    </div>

</div>
