<!-- SIDEBAR -->
<div class="sidebar" id="hub-sidebar">
    <div class="sidebar-header" id="hub-sidebar-header">
        <div onclick="window.navigateTo('/')" style="display: flex; align-items: center; cursor: pointer; flex: 1;">
            <img src="/assets/logo.ico" onerror="this.src='/assets/favicon.ico'" class="logo" alt="cluaiz Logo"
                style="width: 24px; height: 24px;">
            <span>Plugin Lab</span>
        </div>
        <button id="hub-sidebar-close-btn" class="sidebar-toggle-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                <path d="M15 18l-6-6 6-6" />
            </svg>
        </button>
    </div>
    <div class="nav-container" id="hub-nav-container" style="display: flex; flex-direction: column; flex: 1; padding: 0;">

        <!-- Include marked.js for Markdown parsing -->
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        
        <style>
            /* Adjustments to make the Chat UI look better in the narrow sidebar */
            #hub-chat-sidebar-container {
                padding-bottom: 16px; /* Margin from bottom */
            }
            #hub-chat-sidebar-container #chat-textarea {
                font-size: 0.85rem !important;
            }
            #hub-chat-sidebar-container i[data-lucide="plus"],
            #hub-chat-sidebar-container i[data-lucide="mic"],
            #hub-chat-sidebar-container i[data-lucide="send"] {
                width: 18px !important;
                height: 18px !important;
            }
            #hub-chat-sidebar-container #model-select-btn {
                font-size: 0.75rem !important;
            }
            #hub-chat-sidebar-container #attach-btn, 
            #hub-chat-sidebar-container #send-btn,
            #hub-chat-sidebar-container #mic-wrapper button {
                width: 32px !important;
                height: 32px !important;
                padding: 0 !important;
            }
            #hub-chat-sidebar-container .chat-messages {
                padding: 4px 0 !important;
            }
            #hub-chat-sidebar-container .chat-stream-container {
                padding: 8px 12px !important; /* Added left/right padding to protect text from scrollbar */
            }
            #hub-chat-sidebar-container .chat-message {
                padding: 0 !important;
                margin: 0 !important;
            }
            #hub-chat-sidebar-container .message-bubble {
                padding: 4px 0 !important;
                font-size: 0.85rem !important;
            }
            #hub-chat-sidebar-container .user-bubble {
                padding: 8px 12px !important; /* Keep some padding for user bubble since it has a background */
            }
        </style>
        <!-- Chat in Sidebar (Full Screen) -->
        <div id="hub-chat-sidebar-container" style="flex: 1; overflow: hidden; display: flex; flex-direction: column; width: 100%;">
            <!-- Imported Chat UI mounts here -->
        </div>
    </div>
</div>

<!-- Horizontal Resizer -->
<div class="resizer-horizontal" id="hub-sidebar-resizer"></div>

<!-- Workspace -->
<div id="view-hub" class="workspace" style="flex: 1; position: relative;">
    <!-- Request Header (Top Bar) -->
    <div class="request-header" id="hub-main-header" style="gap: 8px; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <button id="hub-sidebar-open-btn" class="sidebar-toggle-btn hidden"
                style="width: 38px; height: 38px; display: flex; justify-content: center; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 6px;">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                    <path d="M3 12h18M3 6h18M3 18h18" />
                </svg>
            </button>
            <div class="engine-toggle" style="display: flex; align-items: center; background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px;">
                <button class="toggle-btn mock-btn active" style="padding: 6px 12px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">Fake AI (Mock)</button>
                <button class="toggle-btn real-btn" style="padding: 6px 12px; border: none; background: transparent; color: var(--text-muted); cursor: pointer;">Real Engine</button>
            </div>
        </div>
        
        <div style="display: flex; gap: 8px;">
            <button class="send-btn" id="hub-btn-install" style="background-color: var(--text-accent); color: #000;">Load Unpacked (Install)</button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-target="panel-snippet">Snippet Tester</div>
        <div class="tab" data-target="panel-manifest">Manifest JSON</div>
    </div>

    <!-- Panels -->
    <div class="panels">
        <!-- Top Panel: Workspace -->
        <div class="panel-top" id="hub-panel-top-container">
            <div class="panel-header">
                <span id="hub-panel-left-title">Workspace</span>
                <span style="background: var(--method-get-bg); color: var(--method-get); padding: 2px 8px; border-radius: 12px; font-size: 0.75rem;">Sandbox Active</span>
            </div>

            <div class="panel-body hidden" id="panel-manifest" style="padding: 0; display: none;">
                <div class="form-group" style="height: 100%; display: flex; flex-direction: column; margin: 0;">
                    <div style="flex: 1 1 auto; position: relative;" id="hub-manifest-container">
                        <!-- JSON Editor mounts here -->
                    </div>
                </div>
            </div>

            <div class="panel-body" id="panel-snippet" style="padding: 0; display: block;">
                <div class="form-group" style="height: 100%; display: flex; flex-direction: column; margin: 0;">
                    <div style="flex: 1 1 auto; position: relative;" id="hub-snippet-container">
                        <!-- Tiny CodeMirror mounts here -->
                    </div>
                </div>
            </div>
        </div>

        <div class="resizer" id="hub-drag-resizer"></div>

        <!-- Bottom Panel: Response -->
        <div class="panel-bottom" id="hub-panel-bottom-container">
            <div class="panel-header" style="cursor: pointer;" id="hub-response-header">
                <span id="hub-response-toggle-icon">▼ Logs & Output</span>
                <div class="response-status" id="hub-res-status">
                    <span>Mem: 12 MB</span>
                    <span>Time: 42 ms</span>
                    <span>Tokens: 133</span>
                </div>
            </div>
            
            <div class="tabs" style="border-top: 1px solid var(--border); border-bottom: none; background: transparent;">
                <div class="tab active" data-bottom="tab-timeline" style="padding: 8px 16px;">Event Timeline</div>
                <div class="tab" data-bottom="tab-console" style="padding: 8px 16px;">Console</div>
            </div>
            
            <div class="panel-body" id="hub-res-body-container" style="padding: 0;">
                <div id="tab-timeline" style="display: block; padding: 20px; font-family: 'Fira Code', monospace; font-size: 0.85rem; color: var(--text-muted);">
                    <div style="margin-bottom: 4px;"><span style="color: var(--text-accent);">[14:02:01]</span> Plugin Sandbox Initialized</div>
                    <div style="margin-bottom: 4px;"><span style="color: var(--text-accent);">[14:02:02]</span> Loaded fake context (Fake AI Mode)</div>
                </div>
                <div id="tab-console" style="display: none; padding: 20px; font-family: 'Fira Code', monospace; font-size: 0.85rem; color: var(--text-muted);">
                    Waiting for execution...
                </div>
            </div>
        </div>
    </div>
</div>
