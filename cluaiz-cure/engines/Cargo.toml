[package]
name = "engines"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"

[dependencies]
# ── Async & Web ──
tokio   = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
dirs = "5"

# ── System Hardware Info ──
sysinfo = "0.30"
sys-locale = "0.3"
mac_address = "1.1"

# ── Serialization ──
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Logging ──
tracing = "0.1.44"

# ── CURE Unified Core ──
uuid = { version = "1", features = ["v4"] }

# ── Shared Workspace Member Links ──
archer-shared = { path = "archer-shared" }
archer-llama  = { path = "llama" }
archer-candle = { path = "candle" }
# archer-bitnet is loaded dynamically at runtime via libloading (avoids links conflict)
system-booster = { path = "system-booster", optional = true }

# ── Dynamic Neural Bridge (The Soul Linker) ──
libloading = "0.8"

# ── Common Utilities (Used by All) ──
candle-core         = { git = "https://github.com/huggingface/candle.git" }
candle-nn           = { git = "https://github.com/huggingface/candle.git" }
tokenizers          = "0.22.2"
once_cell           = "1.19"
anyhow              = "1.0.102"
chrono              = { version = "0.4", features = ["serde"] }
rayon               = "1.10"
dashmap             = "6.1"
rand                = "0.9"
memmap2             = "0.9"
zip                 = "2.2"


[build-dependencies]
cc = "1.2.59"

[features]
default = ["system-booster"]
