[package]
name = "archer-bitnet"
version = "0.1.0"
edition = "2021"
authors = ["Aryan <creator@cluaiz.os>"]

[lib]
name = "archer_bitnet"
crate-type = ["cdylib", "rlib"]

[dependencies]
# ── Native BitNet Backend ──
bitnet-llm = { version = "1.0.3", optional = true }
candle-core = { git = "https://github.com/huggingface/candle.git", features = ["cuda"] }
anyhow = "1.0.102"
tracing = "0.1"
# We need to link back to shared types manually since we are excluded
archer-shared = { path = "../archer-shared" }

[features]
default = []
bitnet = ["dep:bitnet-llm"]
