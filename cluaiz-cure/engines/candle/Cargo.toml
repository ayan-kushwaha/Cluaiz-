[package]
name = "archer-candle"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# ── Native Candle Backend (Hugging Face) ──
candle-core         = { git = "https://github.com/huggingface/candle.git" }
candle-nn           = { git = "https://github.com/huggingface/candle.git" }
candle-transformers = { git = "https://github.com/huggingface/candle.git" }
anyhow = "1.0.102"
tracing = "0.1"
archer-shared = { path = "../archer-shared" }
tokenizers = "0.22.2"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "candle-transformers/flash-attn"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
cudnn = ["candle-core/cudnn"]




