[package]
name = "archer-llama"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# ── Native LLaMA Backend (Optional for Universal Build) ──
llama-cpp-2 = { version = "0.1.143", optional = true }
anyhow = "1.0"
tracing = "0.1"
archer-shared = { path = "../archer-shared" }
tokenizers = "0.22.2"
libloading = "0.8"
strum = { version = "0.26", features = ["derive"] }
candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.10.2" }
tokio = { version = "1.37", features = ["full"] }

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
metal = ["llama-cpp-2/metal"]
rocm = ["llama-cpp-2/rocm"]
vulkan = ["llama-cpp-2/vulkan"]
